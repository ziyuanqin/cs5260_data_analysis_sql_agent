<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent UI Mock</title>
    <link rel="stylesheet" href="./style.css" />
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"], ["$", "$"]],
          displayMath: [["\\[", "\\]"], ["$$", "$$"]],
          processEscapes: true,
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
        },
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    <!-- 整体布局：左侧边栏 + 右侧主区域 -->
    <div class="layout">
      <!-- 左侧导航栏（视觉风格参考截图） -->
      <aside class="sidebar">
        <div class="logo-container">
          <img src="./nus_logo.jpg" alt="NUS Logo" class="nus-logo" />
          <span class="course-title">CS5260</span>
        </div>

        <button id="newChatBtn" class="nav-btn primary">新聊天</button>

        <section class="history-block">
          <div class="history-header">
            <h3>聊天</h3>
            <button id="clearHistoryBtn" class="history-clear-btn" type="button" aria-label="清除所有聊天记录">✕</button>
          </div>
          <div id="historyList"></div>
        </section>

        <div id="dbSidebarSection" class="sidebar-footer" style="display: none;">
          <button id="dbConnectBtn" class="sidebar-btn">
            <span>🔌 Database Connection</span>
          </button>

          <button id="dbDisconnectBtn" class="sidebar-btn btn-danger" style="display: none;">
            <span>🚫 Disconnect DB</span>
          </button>
        </div>

        <div id="dbModal" class="modal-overlay" hidden>
          <div class="modal-content">
            <h3>Database Connection</h3>
            <form id="dbForm">
              <input type="text" name="host" placeholder="Host ( e.g. localhost )" required>
              <input type="text" name="port" placeholder="Port ( e.g. 5432 )" required>
              <input type="text" name="user" placeholder="Username" required>
              <input type="password" name="password" placeholder="Password" required>
              <input type="text" name="database" placeholder="Database Name" required>
              <div class="modal-actions">
                <button type="button" id="closeModal">Cancel</button>
                <button type="submit" class="primary-btn">Connect</button>
              </div>
            </form>
          </div>
        </div>
      </aside>

      <!-- 右侧主内容区 -->
      <main id="mainPanel" class="main empty">
        <!-- 顶部操作栏 -->
        <header class="main-topbar">
          <button class="model-switch">普通模型▾</button>
        </header>

        <div class="content-row">
          <!-- 聊天内容区 -->
          <section id="messageList" class="conversation" aria-live="polite">
            <div id="emptyState" class="empty-state">
              <h1 id="emptyTitle" class="empty-title">你好，我是通用模式</h1>
            </div>
          </section>

          <aside id="htmlPreviewPane" class="html-preview" hidden>
            <div class="html-preview-title">
              <span>HTML预览</span>
              <button id="htmlPreviewCloseBtn" class="html-preview-close" type="button" aria-label="关闭HTML预览">关闭</button>
            </div>
            <iframe id="htmlPreviewFrame" class="html-preview-frame" sandbox="allow-scripts allow-forms"></iframe>
          </aside>
        </div>

        <!-- 底部输入栏（悬浮样式） -->
        <footer class="composer-wrap">
          <form id="composerForm" class="composer">
            <button class="circle-btn" type="button" aria-label="更多">＋</button>
            <textarea id="composerInput" rows="1" placeholder="有问题，尽管问"></textarea>
            <button id="sendBtn" class="circle-send" type="submit" aria-label="发送">➤</button>
            <div class="chip-row" aria-label="功能开关">
              <button id="taskChipBtn" class="feature-chip" type="button">✶ 专家模式</button>
              <button id="fileUploadBtn" class="feature-chip" type="button">文件上传</button>
              <button id="edaAnalysisToggleBtn" class="feature-chip" type="button">EDA分析</button>
              <button id="sqlAnalysisToggleBtn" class="feature-chip" type="button">SQL分析</button>
            </div>
            <input id="fileUploadInput" type="file" multiple hidden />
            <div id="uploadStatus" class="upload-status" aria-live="polite" hidden></div>
          </form>
        </footer>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
