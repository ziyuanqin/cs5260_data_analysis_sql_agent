<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Analysis Agent - Test Frontend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-indicator.ready {
            background: #10b981;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f3f4f6;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        button.secondary {
            background: #64748b;
        }

        button.secondary:hover {
            background: #475569;
        }

        button.danger {
            background: #ef4444;
        }

        button.danger:hover {
            background: #dc2626;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .response-section {
            margin-top: 20px;
            padding: 16px;
            background: #f9fafb;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .response-section h3 {
            font-size: 14px;
            color: #667eea;
            margin-bottom: 8px;
        }

        .response-content {
            font-size: 13px;
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .error {
            background: #fef2f2;
            border-left-color: #ef4444;
        }

        .error h3 {
            color: #ef4444;
        }

        .chat-container {
            grid-column: 1 / -1;
        }

        .chat-messages {
            height: 300px;
            overflow-y: auto;
            padding: 16px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
        }

        .message.user {
            background: #667eea;
            color: white;
            margin-left: auto;
        }

        .message.agent {
            background: white;
            border: 1px solid #e5e7eb;
        }

        .message-label {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .chart-preview {
            margin-top: 12px;
            text-align: center;
        }

        .chart-preview img {
            max-width: 100%;
            border-radius: 8px;
            border: 2px solid #e5e7eb;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .info-item {
            padding: 12px;
            background: #f3f4f6;
            border-radius: 6px;
        }

        .info-item strong {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .info-item span {
            font-size: 16px;
            color: #111827;
            font-weight: 600;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f4f6;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🤖 Data Analysis Agent</h1>
            <div class="status">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">Not Connected</span>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- API Key Setup -->
            <div class="card">
                <h2>1️⃣ Setup API Key</h2>
                <div class="form-group">
                    <label for="apiKey">OpenAI API Key</label>
                    <input type="text" id="apiKey" placeholder="sk-...">
                </div>
                <div class="form-group">
                    <label for="apiUrl">API Base URL</label>
                    <input type="text" id="apiUrl" value="http://localhost:8000" placeholder="http://localhost:8000">
                </div>
                <button onclick="setApiKey()">Set API Key</button>
                <div id="apiKeyResponse" class="response-section hidden"></div>
            </div>

            <!-- File Upload -->
            <div class="card">
                <h2>2️⃣ Upload CSV</h2>
                <div class="form-group">
                    <label for="csvFile">Choose CSV File</label>
                    <input type="file" id="csvFile" accept=".csv">
                </div>
                <div class="form-group">
                    <label for="threadId">Thread ID (optional)</label>
                    <input type="text" id="threadId" placeholder="Auto-generated if empty">
                </div>
                <button onclick="uploadFile()" id="uploadBtn" disabled>Upload & Analyze</button>
                <div id="uploadResponse" class="response-section hidden"></div>
            </div>
        </div>

        <!-- State Info -->
        <div class="card hidden" id="stateCard">
            <h2>📊 Session State</h2>
            <div class="info-grid" id="stateInfo"></div>
            <div class="button-group" style="margin-top: 16px;">
                <button class="secondary" onclick="getState()">Refresh State</button>
                <button class="secondary" onclick="getEdaReport()">View EDA Report</button>
                <button class="secondary" onclick="downloadCsv()">Download CSV</button>
            </div>
        </div>

        <!-- Chat Interface -->
        <div class="card chat-container hidden" id="chatCard">
            <h2>💬 Chat Interface</h2>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="form-group">
                <textarea id="chatInput" placeholder="Enter your message... (e.g., 'drop column Id', 'fill NaN in Age with mean', 'histogram of Age')"></textarea>
            </div>
            <div class="button-group">
                <button onclick="sendChat()">Send Message</button>
                <button class="secondary" onclick="clearChat()">Clear Chat</button>
            </div>
            <div id="chartPreview" class="chart-preview hidden"></div>
        </div>

        <!-- Human Response (Error Handling) -->
        <div class="card hidden" id="humanResponseCard">
            <h2>⚠️ Error - Action Required</h2>
            <div id="errorMessage" class="response-section error"></div>
            <div class="button-group" style="margin-top: 16px;">
                <button onclick="sendHumanResponse('retry')">Retry</button>
                <button class="secondary" onclick="sendHumanResponse('skip')">Skip</button>
                <button class="danger" onclick="sendHumanResponse('abort')">Abort</button>
            </div>
        </div>
    </div>

    <script>
        let baseUrl = 'http://localhost:8000';
        let currentThreadId = null;
        let chatHistory = [];

        // Check API key status on load
        window.onload = async () => {
            baseUrl = document.getElementById('apiUrl').value;
            await checkApiKeyStatus();
        };

        async function checkApiKeyStatus() {
            try {
                const response = await fetch(`${baseUrl}/api-key/status`);
                const data = await response.json();
                
                if (data.llm_ready) {
                    updateStatus(true, 'LLM Ready');
                    document.getElementById('uploadBtn').disabled = false;
                } else {
                    updateStatus(false, 'API Key Required');
                }
            } catch (error) {
                updateStatus(false, 'Cannot Connect to API');
                console.error('Connection error:', error);
            }
        }

        function updateStatus(ready, text) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            
            if (ready) {
                indicator.classList.add('ready');
            } else {
                indicator.classList.remove('ready');
            }
            statusText.textContent = text;
        }

        async function setApiKey() {
            const apiKey = document.getElementById('apiKey').value.trim();
            baseUrl = document.getElementById('apiUrl').value;
            
            if (!apiKey) {
                showResponse('apiKeyResponse', 'Please enter an API key', true);
                return;
            }

            try {
                const response = await fetch(`${baseUrl}/api-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ api_key: apiKey })
                });

                const data = await response.json();
                
                if (response.ok) {
                    showResponse('apiKeyResponse', data.message, false);
                    updateStatus(true, 'LLM Ready');
                    document.getElementById('uploadBtn').disabled = false;
                } else {
                    showResponse('apiKeyResponse', data.detail || 'Failed to set API key', true);
                }
            } catch (error) {
                showResponse('apiKeyResponse', `Error: ${error.message}`, true);
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('csvFile');
            const threadId = document.getElementById('threadId').value.trim();
            
            if (!fileInput.files[0]) {
                showResponse('uploadResponse', 'Please select a CSV file', true);
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            const url = threadId 
                ? `${baseUrl}/upload?thread_id=${encodeURIComponent(threadId)}`
                : `${baseUrl}/upload`;

            try {
                const uploadBtn = document.getElementById('uploadBtn');
                uploadBtn.innerHTML = 'Uploading<span class="loading"></span>';
                uploadBtn.disabled = true;

                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (response.ok) {
                    currentThreadId = data.thread_id;
                    document.getElementById('threadId').value = currentThreadId;
                    showResponse('uploadResponse', data.message, false);
                    updateStateDisplay(data.state);
                    addChatMessage('agent', data.message);
                    document.getElementById('chatCard').classList.remove('hidden');
                } else {
                    showResponse('uploadResponse', data.detail || 'Upload failed', true);
                }
            } catch (error) {
                showResponse('uploadResponse', `Error: ${error.message}`, true);
            } finally {
                const uploadBtn = document.getElementById('uploadBtn');
                uploadBtn.innerHTML = 'Upload & Analyze';
                uploadBtn.disabled = false;
            }
        }

        async function getState() {
            if (!currentThreadId) return;

            try {
                const response = await fetch(`${baseUrl}/state/${currentThreadId}`);
                const data = await response.json();
                
                if (response.ok) {
                    updateStateDisplay(data);
                }
            } catch (error) {
                console.error('Error fetching state:', error);
            }
        }

        function updateStateDisplay(state) {
            const stateCard = document.getElementById('stateCard');
            const stateInfo = document.getElementById('stateInfo');
            
            stateCard.classList.remove('hidden');
            
            const items = [
                { label: 'Thread ID', value: state.thread_id || 'N/A' },
                { label: 'Step', value: state.step || 'N/A' },
                { label: 'Rows', value: state.schema_info?.row_count || 'N/A' },
                { label: 'Columns', value: state.schema_info?.col_count || 'N/A' },
                { label: 'EDA Ready', value: state.has_eda_report ? '✅ Yes' : '❌ No' },
                { label: 'Charts', value: state.available_charts?.length || 0 }
            ];

            stateInfo.innerHTML = items.map(item => `
                <div class="info-item">
                    <strong>${item.label}</strong>
                    <span>${item.value}</span>
                </div>
            `).join('');

            // Check for human intervention needed
            if (state.awaiting_human && state.error) {
                showErrorPrompt(state.error, state.error_type);
            }
        }

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message || !currentThreadId) return;

            addChatMessage('user', message);
            input.value = '';

            try {
                const response = await fetch(`${baseUrl}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        thread_id: currentThreadId,
                        message: message
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    addChatMessage('agent', data.message);
                    updateStateDisplay(data.state);
                    
                    // Show chart if available
                    if (data.plot_b64) {
                        showChart(data.plot_b64, data.plot_type);
                    } else {
                        document.getElementById('chartPreview').classList.add('hidden');
                    }
                } else {
                    addChatMessage('agent', `Error: ${data.detail}`, true);
                }
            } catch (error) {
                addChatMessage('agent', `Error: ${error.message}`, true);
            }
        }

        function addChatMessage(sender, content, isError = false) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const label = sender === 'user' ? 'You' : 'Agent';
            messageDiv.innerHTML = `
                <div class="message-label">${label}</div>
                <div class="response-content">${content}</div>
            `;
            
            if (isError) {
                messageDiv.style.background = '#fef2f2';
                messageDiv.style.borderLeft = '3px solid #ef4444';
            }
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function clearChat() {
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('chartPreview').classList.add('hidden');
        }

        function showChart(base64Data, chartType) {
            const preview = document.getElementById('chartPreview');
            preview.innerHTML = `
                <h3>Chart: ${chartType || 'Custom Plot'}</h3>
                <img src="data:image/png;base64,${base64Data}" alt="Chart">
            `;
            preview.classList.remove('hidden');
        }

        async function getEdaReport() {
            if (!currentThreadId) return;
            window.open(`${baseUrl}/eda-report/${currentThreadId}`, '_blank');
        }

        async function downloadCsv() {
            if (!currentThreadId) return;
            window.open(`${baseUrl}/download-csv/${currentThreadId}`, '_blank');
        }

        function showErrorPrompt(error, errorType) {
            const card = document.getElementById('humanResponseCard');
            const errorMsg = document.getElementById('errorMessage');
            
            errorMsg.innerHTML = `
                <h3>Error Type: ${errorType || 'Unknown'}</h3>
                <div class="response-content">${error}</div>
            `;
            
            card.classList.remove('hidden');
        }

        async function sendHumanResponse(decision) {
            if (!currentThreadId) return;

            try {
                const response = await fetch(`${baseUrl}/human-response`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        thread_id: currentThreadId,
                        decision: decision
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('humanResponseCard').classList.add('hidden');
                    addChatMessage('agent', data.message);
                    updateStateDisplay(data.state);
                } else {
                    alert(`Error: ${data.detail}`);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function showResponse(elementId, message, isError) {
            const element = document.getElementById(elementId);
            element.classList.remove('hidden');
            if (isError) {
                element.classList.add('error');
            } else {
                element.classList.remove('error');
            }
            element.innerHTML = `
                <h3>${isError ? 'Error' : 'Response'}</h3>
                <div class="response-content">${message}</div>
            `;
        }

        // Allow Enter key to send chat messages
        document.getElementById('chatInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChat();
            }
        });
    </script>
</body>
</html>
